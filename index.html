<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="refresh" content="0; url=./docs/" />
  <meta name="description" content="Mapa interactivo de sensores, telemetria, LPWAN, arquitectura IoT territorial y pentesting defensivo." />
  <link rel="canonical" href="./docs/" />
  <title>Sensores, Telemetria e IoT Territorial</title>
  <style>
    :root{
      --ink:#172016;
      --muted:#667260;
      --line:#d8d3c7;
      --accent:#237b61;
      --paper:#fffdf7;
      --bg:#f3efe4;
    }

    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      font-family:Arial, sans-serif;
      color:var(--ink);
      background:
        linear-gradient(135deg, rgba(35,123,97,.08), transparent 34%),
        linear-gradient(315deg, rgba(42,111,155,.08), transparent 32%),
        var(--bg);
    }

    main{
      width:min(720px, calc(100% - 40px));
      padding:34px;
      border:1px solid var(--line);
      border-radius:22px;
      background:var(--paper);
      box-shadow:0 24px 70px rgba(23,32,22,.12);
    }

    h1{
      margin:0 0 12px;
      font-size:clamp(2rem, 5vw, 3.2rem);
      line-height:1;
    }

    p{
      color:var(--muted);
      line-height:1.65;
    }

    .actions{
      display:flex;
      flex-wrap:wrap;
      gap:12px;
      margin-top:22px;
    }

    a{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-height:44px;
      padding:0 18px;
      border-radius:999px;
      color:#fffdf7;
      background:var(--accent);
      text-decoration:none;
      font-weight:800;
    }

    .secondary{
      color:var(--accent);
      background:#e2f1ea;
    }
  </style>
</head>
<body>
  <main>
    <h1>Sensores, Telemetria e IoT Territorial</h1>
    <p>Redirigiendo a la visualizacion interactiva: sensores, LPWAN, gateways, telemetria, arquitectura segura, red team IoT, blue team y practica TTN.</p>
    <div class="actions">
      <a href="./docs/">Abrir visualizacion</a>
      <a class="secondary" href="./README.md">Ver README</a>
    </div>
  </main>
  <script>
    window.location.replace("./docs/");
  </script>
</body>
</html>
